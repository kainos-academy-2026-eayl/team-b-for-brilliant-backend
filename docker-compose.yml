# Local development Postgres database
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (deletes all data!)

services:
  db:
    image: postgres:17-alpine
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Keeps your data between restarts
      - pgdata:/var/lib/postgresql/data
      # Any .sql or .sh files in ./db/init run once, on first startup only
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev} -d ${POSTGRES_DB:-app_dev}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
