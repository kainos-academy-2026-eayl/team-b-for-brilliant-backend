name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - labeled

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint Fix
        run: npm run lint:fix

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Display message
        run: echo "::notice::Hello from the Workflow!"

  build:
    name: Build
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          if-no-files-found: error

  docker-compose:
    name: Docker Compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: team-b-for-brilliant-backend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: team-b-for-brilliant-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-frontend
            token: ${{ secrets.BRILLIANT_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-frontend

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: team-b-for-brilliant-backend/dist

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check frontend health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  on-merge:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'Deployment'
      )
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
        - name: Checkout backend
          uses: actions/checkout@v4
          with:
            path: team-b-for-brilliant-backend

        - name: Checkout frontend
          uses: actions/checkout@v4
          with:
            repository: kainos-academy-2026-eayl/team-b-for-brilliant-frontend
            token: ${{ secrets.BRILLIANT_REPO_TOKEN || github.token }}
            path: team-b-for-brilliant-frontend

        - name: Download backend build
          uses: actions/download-artifact@v4
          with:
            name: backend-dist
            path: team-b-for-brilliant-backend/dist

        - name: AZ Login
          run: |
            az login --service-principal \
              --username ${{ secrets.AZURE_CLIENT_ID }} \
              --password ${{ secrets.AZURE_SECRET }} \
              --tenant ${{ secrets.AZURE_TENANT_ID }} \
              --subscription ${{ secrets.SUBSCRIPTION_ID }}
        
        - name: Log in to ACR
          run: |
            az acr login --name ${{ secrets.ACR_NAME }}

        - name: Build and start services
          working-directory: team-b-for-brilliant-backend
          env:
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          run: |
            docker compose up --build --wait --wait-timeout 120
            docker tag "$(docker compose images --quiet backend)" ${{ secrets.ACR_NAME }}/backend:${{ github.sha }}
            docker push ${{ secrets.ACR_NAME }}/backend:${{ github.sha }}

