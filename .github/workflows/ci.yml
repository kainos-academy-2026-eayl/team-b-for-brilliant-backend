name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-lint-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        # Placeholder URL: tests inject mocks, and Prisma only connects on first query.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run test
