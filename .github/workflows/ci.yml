name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - labeled

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint Fix
        run: npm run lint:fix

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Display message
        run: echo "::notice::Hello from the Workflow!"

  build:
    name: Build
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          if-no-files-found: error

  docker-compose:
    name: Docker Compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: team-b-for-brilliant-backend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: team-b-for-brilliant-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-frontend
          token: ${{ secrets.BRILLIANT_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-frontend

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: team-b-for-brilliant-backend/dist

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check frontend health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  on-merge:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'Deployment'
      )
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
        - name: Checkout backend
          uses: actions/checkout@v4
          with:
            path: team-b-for-brilliant-backend

        - name: Checkout frontend
          uses: actions/checkout@v4
          with:
            repository: kainos-academy-2026-eayl/team-b-for-brilliant-frontend
            token: ${{ secrets.BRILLIANT_REPO_TOKEN || github.token }}
            path: team-b-for-brilliant-frontend

        - name: Download backend build
          uses: actions/download-artifact@v4
          with:
            name: backend-dist
            path: team-b-for-brilliant-backend/dist

        - name: AZ Login
          run: |
            az login --service-principal \
              --username ${{ secrets.AZURE_CLIENT_ID }} \
              --password ${{ secrets.AZURE_SECRET }} \
              --tenant ${{ secrets.AZURE_TENANT_ID }} \
              --subscription ${{ secrets.SUBSCRIPTION_ID }}
        
        - name: Log in to ACR
          run: |
            az acr login --name ${{ vars.ACR_LOGIN_NAME }}

        - name: Build and start services
          working-directory: team-b-for-brilliant-backend
          env:
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          run: |
            docker compose up --build --wait --wait-timeout 120
            docker tag "$(docker compose images --quiet backend)" ${{ vars.ACR_LOGIN_NAME }}/backend:${{ github.sha }}
            docker push ${{ vars.ACR_LOGIN_NAME }}/backend:${{ github.sha }}

  terraform-plan:
    name: Terraform Plan Dev
    runs-on: ubuntu-latest
    needs: docker-compose
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      merged-pr: ${{ steps.merged-pr.outputs.result }}
      terraform-version: ${{ steps.terraform-version.outputs.version }}
    concurrency:
      group: terraform-backend-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: my-infrastructure
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_acr_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
      TF_VAR_environment: dev
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Record Terraform version
        id: terraform-version
        run: echo "version=$(terraform version -json | jq -r '.terraform_version')" >> "$GITHUB_OUTPUT"

      - name: Confirm merged pull request
        id: merged-pr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100
              }
            );
            return pullRequests.some(pr =>
              pr.merged_at !== null &&
              pr.base.ref === 'main' &&
              pr.merge_commit_sha === context.sha
            );

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=use_cli=false

      - name: Validate Terraform
        run: terraform validate

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Resolve newest ACR images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          FRONTEND_REPOSITORY: "<frontend repository name in ACR>"
        run: |
          set -euo pipefail

          resolve_image() {
            local repository="$1" digest
            digest=$(az acr manifest list-metadata \
              --registry "$ACR_NAME" \
              --name "$repository" \
              --query 'sort_by([?tags[0] != null && createdTime != null], &createdTime)[-1].digest' \
              --output tsv)

            if [[ "$digest" != sha256:* ]]; then
              echo "::error::No tagged image found in ACR repository $repository" >&2
              return 1
            fi

            printf '%s@%s\n' "$repository" "$digest"
          }

          backend_image=$(resolve_image backend)
          frontend_image=$(resolve_image "$FRONTEND_REPOSITORY")

          printf 'TF_VAR_backend_image=%s\nTF_VAR_frontend_image=%s\n' \
            "$backend_image" "$frontend_image" >> "$GITHUB_ENV"

      - name: Plan Terraform
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Upload Terraform plan
        if: steps.merged-pr.outputs.result == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            my-infrastructure/tfplan
            my-infrastructure/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  terraform-apply:
    name: Terraform Apply Dev
    runs-on: ubuntu-latest
    needs: [terraform-plan, on-merge]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.merged-pr == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-backend-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: my-infrastructure
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_acr_name: ${{ secrets.ACR_NAME }}
      TF_VAR_acr_resource_group_name: ${{ secrets.ACR_RESOURCE_GROUP_NAME }}
      TF_VAR_environment: dev
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.terraform-plan.outputs.terraform-version }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: my-infrastructure

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=use_cli=false -lockfile=readonly

      - name: Apply Terraform plan
        run: terraform apply -input=false -lock-timeout=5m tfplan

